<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Todo App</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin-top: 80px;
        }

        .card {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .2);
        }

        h1 {
            color: #2196f3;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Kubernetes Todo App 🚀</h1>

        <button onclick="loadData()">
            Call Backend
        </button>

        <div id="result"></div>

    </div>

    <script>

        async function loadData() {

            try {

                const response = await fetch("/api");

                if (!response.ok) {
                    throw new Error("HTTP Error: " + response.status);
                }

                const data = await response.json();

                document.getElementById("result").innerHTML = `
                    <h3>${data.message}</h3>
                    <p>Visits: ${data.visits}</p>
                `;

            } catch (err) {

                document.getElementById("result").innerHTML = `
                    <p style="color:red;">
                        ${err.message}
                    </p>
                `;

            }

        }

    </script>

</body>

</html>
